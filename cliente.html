<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Clientes</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav>
<a href="cliente.html" class="active">Clientes</a>
<a href="produto.html">Estoque</a>
</nav>

<div class="container">
<h1>Cadastro de Clientes</h1>


<div class="form-group">
<input type="hidden" id="cliente-index">
<input type="text" id="cliente-nome" placeholder="Nome do Cliente">
<input type="email" id="cliente-email" placeholder="E-mail do Cliente">
<button id="btn-salvar-cliente" onclick="salvarCliente()">Cadastrar Cliente</button>
<button id="btn-cancelar-cliente" style="display:none;"
onclick="cancelarEdicaoCliente()">Cancelar</button>
</div>

<h2>Clientes Cadastrados</h2>
<div id="lista-clientes" class="lista"></div>
</div>

<script src="script.js"></script>
</body>
</html>
